[config]
schemaVersion = "0.0.1"

[general]
repository = "https://thunderstore.io"

[package]
namespace = "Lowlight"
name = "Sanity"
description = "A hidden sanity meter for each player. Stay alone in the dark too long and you start to see and hear things only you can, made from the game's own sounds and effects. No new monsters, and nothing that can really hurt you."
websiteUrl = "https://github.com/lowlightworks/Sanity"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack = "5.4.2305"

[build]
icon = "../../icon.png"
readme = "../../README.md"
outdir = "../../artifacts/thunderstore/"

[[build.copy]]
source = "../../artifacts/bin/Sanity/release/Lowlight.Sanity.dll"
target = "plugins/"

[[build.copy]]
source = "../../CHANGELOG.md"
target = "/"

[[build.copy]]
source = "../../LICENSE"
target = "/"

# The following config options only apply when using TCLI to publish to Thunderstore directly:

[publish]
# See communities at:
# https://thunderstore.io/api/experimental/community/
communities = [ "lethal-company", ]

[publish.categories]
# See categories at:
# https://thunderstore.io/api/experimental/community/lethal-company/category/
lethal-company = [ "mods", "clientside", "hazards", "bepinex", "ai-generated", ]
